<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #e4ebf2;
      color: #111;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(200,210,225,0.25) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .balls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ball {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f2f6fa 45%, #d5dee9 75%, #c0ccd8 100%);
      box-shadow:
        inset -14px -14px 28px rgba(0,0,0,0.12),
        inset 12px 12px 22px rgba(255,255,255,0.75),
        0 18px 45px rgba(0,0,0,0.12);
      animation: float linear infinite;
    }
    /* Solo bolas medianas/grandes, bien distribuidas, sin superposición fuerte */
    .b1 { width: 480px; height: 480px; left: -140px; top: 8%; animation-duration: 11s; }
    .b2 { width: 420px; height: 420px; right: -110px; top: 12%; animation-duration: 9s; animation-delay: -2s; }
    .b3 { width: 520px; height: 520px; left: -160px; bottom: -60px; animation-duration: 13s; animation-delay: -4s; }
    .b4 { width: 450px; height: 450px; right: -120px; bottom: 15%; animation-duration: 10s; animation-delay: -1s; }
    .b5 { width: 260px; height: 260px; left: 18%; top: 48%; animation-duration: 8s; animation-delay: -3s; }
    .b6 { width: 220px; height: 220px; left: 62%; top: 28%; animation-duration: 12s; animation-delay: -5s; }
    .b7 { width: 180px; height: 180px; left: 42%; top: 65%; animation-duration: 7s; animation-delay: -2s; }
    .b8 { width: 200px; height: 200px; right: 22%; bottom: 28%; animation-duration: 9s; }
    @keyframes float {
      0%   { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-25px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    #top {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 3;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 1px;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .logo {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }
    #console {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      max-height: 20vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #333;
      backdrop-filter: blur(4px);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="balls">
    <div class="ball b1"></div>
    <div class="ball b2"></div>
    <div class="ball b3"></div>
    <div class="ball b4"></div>
    <div class="ball b5"></div>
    <div class="ball b6"></div>
    <div class="ball b7"></div>
    <div class="ball b8"></div>
  </div>

  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <img src="./ps-logo.svg" class="logo" alt="PlayStation logo">
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
