<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #f0f4f8;
      color: #111;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .balls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .ball {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      animation: float linear infinite;
    }
    .b1 { width: 80px; height: 80px; left: 8%; top: 15%; animation-duration: 18s; }
    .b2 { width: 40px; height: 40px; left: 85%; top: 25%; animation-duration: 14s; animation-delay: -3s; }
    .b3 { width: 120px; height: 120px; left: 75%; top: 65%; animation-duration: 22s; animation-delay: -7s; }
    .b4 { width: 30px; height: 30px; left: 15%; top: 75%; animation-duration: 16s; animation-delay: -2s; }
    .b5 { width: 60px; height: 60px; left: 45%; top: 10%; animation-duration: 20s; animation-delay: -5s; }
    .b6 { width: 25px; height: 25px; left: 90%; top: 80%; animation-duration: 12s; animation-delay: -1s; }
    @keyframes float {
      0%   { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-25px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    #top {
      position: absolute;
      top: 45px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 1px;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .logo {
      width: 180px;
      height: 180px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.12));
    }
    #console {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      max-height: 20vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #333;
      backdrop-filter: blur(4px);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="balls">
    <div class="ball b1"></div>
    <div class="ball b2"></div>
    <div class="ball b3"></div>
    <div class="ball b4"></div>
    <div class="ball b5"></div>
    <div class="ball b6"></div>
  </div>

  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <!-- PlayStation logo (black) -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 72 L28 38 Q28 22 48 18 Q72 22 72 42 L72 55 Q72 68 55 72 L28 72 Z" fill="#111"/>
      <path d="M38 48 L52 32 L66 48 L52 62 Z" fill="#fff"/>
      <path d="M22 58 Q50 78 78 58" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      <path d="M20 50 Q50 40 80 50" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
