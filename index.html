<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: linear-gradient(160deg, #000000 0%, #0a1628 50%, #0d1b2a 100%);
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    .logo {
      width: 180px;
      height: 180px;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.4));
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
    }
    .subtitle {
      margin-top: 8px;
      font-size: 1.3rem;
      color: #7ec8ff;
      font-weight: 400;
      letter-spacing: 1px;
    }
    #console {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      max-height: 30vh;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #aaa;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- PS5 Logo (simple SVG) -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#0070cc" stroke-width="3"/>
      <path d="M30 55 L50 35 L70 55 L50 75 Z" fill="#0070cc"/>
      <circle cx="50" cy="50" r="8" fill="#ffffff"/>
    </svg>

    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>

    <div id="console"></div>
  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
