<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #e4ebf2;
      color: #111;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(200,210,225,0.3) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px);
      pointer-events: none;
      z-index: 0;
    }
    .balls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ball {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(230,235,245,0.8) 40%, rgba(200,210,225,0.6) 70%, rgba(180,190,210,0.4));
      box-shadow:
        inset -8px -8px 20px rgba(0,0,0,0.08),
        inset 6px 6px 15px rgba(255,255,255,0.6),
        0 10px 30px rgba(0,0,0,0.08);
      animation: float linear infinite;
    }
    .b1 { width: 300px; height: 300px; left: -90px; top: 8%; animation-duration: 9s; }
    .b2 { width: 240px; height: 240px; right: -70px; top: 3%; animation-duration: 7s; animation-delay: -2s; }
    .b3 { width: 340px; height: 340px; left: -110px; bottom: -50px; animation-duration: 11s; animation-delay: -4s; }
    .b4 { width: 280px; height: 280px; right: -80px; bottom: 12%; animation-duration: 8s; animation-delay: -1s; }
    .b5 { width: 200px; height: 200px; left: 32%; top: 42%; animation-duration: 6s; animation-delay: -3s; }
    .b6 { width: 160px; height: 160px; left: 58%; top: 18%; animation-duration: 10s; animation-delay: -5s; }
    .b7 { width: 110px; height: 110px; left: 18%; top: 58%; animation-duration: 5.5s; animation-delay: -2s; }
    .b8 { width: 90px; height: 90px; right: 22%; bottom: 28%; animation-duration: 7.5s; }
    .b9 { width: 70px; height: 70px; left: 48%; bottom: 35%; animation-duration: 6.5s; animation-delay: -1.5s; }
    .b10 { width: 50px; height: 50px; right: 12%; top: 40%; animation-duration: 5s; animation-delay: -3s; }
    @keyframes float {
      0%   { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-35px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    #top {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 3;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 1px;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .logo {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }
    #console {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      max-height: 20vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #333;
      backdrop-filter: blur(4px);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="balls">
    <div class="ball b1"></div>
    <div class="ball b2"></div>
    <div class="ball b3"></div>
    <div class="ball b4"></div>
    <div class="ball b5"></div>
    <div class="ball b6"></div>
    <div class="ball b7"></div>
    <div class="ball b8"></div>
    <div class="ball b9"></div>
    <div class="ball b10"></div>
  </div>

  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <img src="./ps-logo.svg" class="logo" alt="PlayStation logo">
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
