<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #e8eef5;
      color: #1a1a1a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.9) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(220,230,245,0.8) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(240,245,250,0.7) 0%, transparent 50%),
        radial-gradient(circle at 70% 15%, rgba(255,255,255,0.6) 0%, transparent 30%);
      pointer-events: none;
    }
    #top {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.3rem;
      color: #444;
      letter-spacing: 1px;
      font-weight: 400;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .logo {
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }
    #console {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
      max-height: 22vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #333;
      backdrop-filter: blur(4px);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <!-- PlayStation logo in black -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 70 Q20 30 50 25 Q80 30 80 70 Q50 85 20 70 Z" fill="none" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M35 45 L50 30 L65 45 L50 60 Z" fill="#111"/>
      <path d="M30 55 Q50 75 70 55" fill="none" stroke="#111" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M25 48 Q50 38 75 48" fill="none" stroke="#111" stroke-width="5.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
