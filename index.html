<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #e4ebf2;
      color: #111;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(200,210,225,0.3) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.03) 40px, rgba(255,255,255,0.03) 80px);
      pointer-events: none;
      z-index: 0;
    }
    .balls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ball {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f0f4f8 40%, #d0d8e5 70%, #b8c4d6 100%);
      box-shadow:
        inset -12px -12px 25px rgba(0,0,0,0.15),
        inset 10px 10px 20px rgba(255,255,255,0.8),
        0 15px 40px rgba(0,0,0,0.15);
      animation: float linear infinite;
    }
    .b1 { width: 520px; height: 520px; left: -160px; top: 5%; animation-duration: 10s; }
    .b2 { width: 420px; height: 420px; right: -120px; top: 8%; animation-duration: 8s; animation-delay: -2s; }
    .b3 { width: 580px; height: 580px; left: -180px; bottom: -80px; animation-duration: 12s; animation-delay: -4s; }
    .b4 { width: 480px; height: 480px; right: -140px; bottom: 10%; animation-duration: 9s; animation-delay: -1s; }
    .b5 { width: 280px; height: 280px; left: 22%; top: 55%; animation-duration: 7s; animation-delay: -3s; }
    .b6 { width: 220px; height: 220px; left: 68%; top: 22%; animation-duration: 11s; animation-delay: -5s; }
    .b7 { width: 160px; height: 160px; left: 48%; top: 18%; animation-duration: 6s; animation-delay: -2s; }
    .b8 { width: 140px; height: 140px; right: 28%; bottom: 22%; animation-duration: 8s; }
    .b9 { width: 100px; height: 100px; left: 38%; bottom: 28%; animation-duration: 7s; animation-delay: -1.5s; }
    .b10 { width: 80px; height: 80px; right: 18%; top: 48%; animation-duration: 5.5s; animation-delay: -3s; }
    .b11 { width: 200px; height: 200px; left: 75%; top: 62%; animation-duration: 9s; animation-delay: -2.5s; }
    @keyframes float {
      0%   { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-30px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    #top {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 3;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 1px;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .logo {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
    }
    #console {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      max-height: 20vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 14px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #333;
      backdrop-filter: blur(4px);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="balls">
    <div class="ball b1"></div>
    <div class="ball b2"></div>
    <div class="ball b3"></div>
    <div class="ball b4"></div>
    <div class="ball b5"></div>
    <div class="ball b6"></div>
    <div class="ball b7"></div>
    <div class="ball b8"></div>
    <div class="ball b9"></div>
    <div class="ball b10"></div>
    <div class="ball b11"></div>
  </div>

  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <img src="./ps-logo.svg" class="logo" alt="PlayStation logo">
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
