<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JailbreakX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(0, 80, 180, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(0, 100, 200, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    #top {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 40px rgba(0, 120, 255, 0.8);
    }
    .subtitle {
      margin-top: 6px;
      font-size: 1.4rem;
      color: #5dade2;
      letter-spacing: 2px;
      font-weight: 400;
    }
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .logo {
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 0 30px rgba(0, 140, 255, 0.6));
    }
    #console {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
      max-height: 25vh;
      overflow-y: auto;
      background: rgba(0, 10, 30, 0.6);
      border: 1px solid rgba(0, 100, 200, 0.3);
      border-radius: 16px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #a0c4e8;
      backdrop-filter: blur(6px);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="top">
    <h1>JailbreakX</h1>
    <div class="subtitle">by Fer</div>
  </div>

  <div id="center">
    <!-- PlayStation logo in blue -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 70 Q20 30 50 25 Q80 30 80 70 Q50 85 20 70 Z" fill="none" stroke="#0070d1" stroke-width="4" stroke-linejoin="round"/>
      <path d="M35 45 L50 30 L65 45 L50 60 Z" fill="#0070d1"/>
      <path d="M30 55 Q50 75 70 55" fill="none" stroke="#0070d1" stroke-width="6" stroke-linecap="round"/>
      <path d="M25 48 Q50 38 75 48" fill="none" stroke="#0070d1" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="console"></div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
